<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>自驱舱 SelfPilot</title>
<meta name="description" content="给自己用的学习与生活多智能体管理平台">
<meta name="theme-color" content="#3b6fd8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
<style>
:root{
  --bg:#f3f5f7;--panel:#fff;--panel2:#f7f9fb;--ink:#161b22;--muted:#5d6875;--faint:#8b95a1;--line:#e1e6ec;
  --accent:#3b6fd8;--accent-ink:#fff;--accent-soft:#e8effc;--ok:#2f9e6b;--warn:#c98a12;--err:#d0443e;
  --r:12px;--shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1216;--panel:#171b21;--panel2:#1c2129;--ink:#e6eaef;--muted:#a1abb7;--faint:#6f7a87;--line:#2a313b;
  --accent:#7ea3f0;--accent-ink:#0f1216;--accent-soft:#1f2a3f;--ok:#4cc38a;--warn:#e3a93a;--err:#ef6a64;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1216;--panel:#171b21;--panel2:#1c2129;--ink:#e6eaef;--muted:#a1abb7;--faint:#6f7a87;--line:#2a313b;
  --accent:#7ea3f0;--accent-ink:#0f1216;--accent-soft:#1f2a3f;--ok:#4cc38a;--warn:#e3a93a;--err:#ef6a64;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:220px 1fr;height:100vh;height:100dvh}
/* 侧栏 */
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow-y:auto;padding:14px 10px}
.brand{display:flex;align-items:center;gap:8px;padding:4px 8px 14px;font-weight:700;font-size:16px}
.brand small{display:block;font-weight:400;color:var(--faint);font-size:11px}
.navg{font-size:11px;color:var(--faint);padding:12px 10px 4px;letter-spacing:.05em}
.nav a{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--muted)}
.nav a:hover{background:var(--panel2);color:var(--ink)}
.nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .cnt{margin-left:auto;font-size:11px;background:var(--panel2);border-radius:10px;padding:0 7px;color:var(--muted)}
.side .foot{margin-top:auto;padding:10px;font-size:12px;color:var(--faint)}
.main{overflow-y:auto;position:relative}
.page{max-width:1080px;margin:0 auto;padding:24px 24px 64px}
.topbar{display:none}
h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:0}
.sub{color:var(--muted);margin:0 0 18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.card h2{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.card h2 .more{margin-left:auto;font-size:12px;font-weight:400}
.muted{color:var(--muted)}.faint{color:var(--faint);font-size:12px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--err)}
.btn:disabled{opacity:.5;cursor:not-allowed}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=password],input[type=url],select,textarea{
  background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{width:100%;resize:vertical;min-height:70px;line-height:1.55}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
label.f>input,label.f>select,label.f>textarea{font-size:14px;color:var(--ink)}
.form{display:grid;gap:12px}
.form2{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .t{flex:1;min-width:0;overflow-wrap:anywhere}
.item.done .t{text-decoration:line-through;color:var(--faint)}
.tag{display:inline-block;font-size:11px;border-radius:6px;padding:0 6px;background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.tag.high{color:var(--err);border-color:currentColor;background:none}
.tag.low{color:var(--faint)}
.tag.over{color:var(--err)}
.box{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--faint);display:inline-grid;place-items:center;cursor:pointer;flex:none;background:none;padding:0}
.box.on{background:var(--ok);border-color:var(--ok);color:#fff}
.bar{height:6px;background:var(--panel2);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:4px}
.stat{font-size:26px;font-weight:700;line-height:1.2}
.empty{color:var(--faint);padding:14px 0;text-align:center}
.banner{background:var(--accent-soft);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.tabs a{padding:4px 12px;border-radius:20px;color:var(--muted);border:1px solid var(--line)}
.tabs a.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.av{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:17px;flex:none;background:var(--panel2)}
.habit-cell{width:22px;height:22px;border-radius:5px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;padding:0}
.habit-cell.on{background:var(--ok);border-color:var(--ok)}
.habit-cell.today{outline:2px solid var(--accent);outline-offset:1px}
.hgrid{display:grid;gap:4px;align-items:center}
/* 对话 */
.chat{display:grid;grid-template-columns:240px 1fr;height:100vh;height:100dvh}
.threads{border-right:1px solid var(--line);overflow-y:auto;background:var(--panel);padding:12px 8px}
.threads a{display:block;padding:8px 10px;border-radius:8px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.threads a .faint{display:block}
.threads a.on{background:var(--accent-soft)}
.conv{display:flex;flex-direction:column;min-width:0;height:100%}
.convh{padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
.msg{display:flex;gap:10px;max-width:820px;width:100%}
.msg.user{align-self:flex-end;justify-content:flex-end}
.msg.user .bub{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.msg.step{align-self:center;max-width:680px}
.msg.step .bub{background:none;border-style:dashed;color:var(--muted);font-size:12px}
.bub{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:0;overflow-wrap:anywhere}
.bub.err{border-color:var(--err)}
.who{font-size:12px;color:var(--muted);margin-bottom:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.md p{margin:.3em 0}.md ul,.md ol{margin:.3em 0;padding-left:1.4em}.md h3,.md h4,.md h5{margin:.6em 0 .3em;font-size:15px}
.md pre{background:var(--panel2);padding:10px;border-radius:8px;overflow-x:auto;font-size:12px}
.md code{background:var(--panel2);padding:0 4px;border-radius:4px;font-size:.92em}
.md pre code{padding:0;background:none}
.md blockquote{margin:.4em 0;padding:2px 10px;border-left:3px solid var(--line);color:var(--muted)}
.md table{border-collapse:collapse;font-size:13px}.md th,.md td{border:1px solid var(--line);padding:4px 8px}
.md .tbl{overflow-x:auto}
.cursor::after{content:'▍';animation:blink 1s infinite;color:var(--accent)}
@keyframes blink{50%{opacity:0}}
.acts{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.act{font-size:12px;border:1px solid var(--line);border-radius:8px;padding:4px 8px;display:flex;gap:6px;align-items:center;background:var(--panel2)}
.act.done{color:var(--ok)}.act.error{color:var(--err)}
.composer{border-top:1px solid var(--line);background:var(--panel);padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.composer textarea{min-height:44px;max-height:200px}
.mentions{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.mentions button{font-size:12px;border:1px solid var(--line);background:var(--panel2);border-radius:14px;padding:2px 9px;cursor:pointer;white-space:nowrap}
/* 卡片复习 */
.flash{min-height:180px;display:grid;place-items:center;text-align:center;font-size:18px;padding:24px;border:1px dashed var(--line);border-radius:var(--r);background:var(--panel2)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:20px;z-index:99;max-width:90vw;font-size:13px}
.toast.err{background:var(--err);color:#fff}
.scrim{display:none}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 30% 0 0;z-index:50;transform:translateX(-102%);transition:transform .2s}
  .app.open .side{transform:none}
  .app.open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40}
  .topbar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:30}
  .page{padding:16px 16px 64px}
  .chat{grid-template-columns:1fr;height:calc(100dvh - 53px)}
  .threads{display:none}
  .chat.list .threads{display:block}.chat.list .conv{display:none}
  .form2{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr}
  .msgs{padding:12px}
}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="scrim" data-a="menu"></div>
  <aside class="side" id="side"></aside>
  <main class="main" id="mainwrap">
    <div class="topbar"><button class="btn ghost" data-a="menu" aria-label="菜单">☰</button><b id="toptitle">自驱舱</b></div>
    <div id="main"></div>
  </main>
</div>
<script src="js/util.js"></script>
<script src="js/store.js"></script>
<script src="js/llm.js"></script>
<script src="js/engine.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
