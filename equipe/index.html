<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Équipe：个人学习与生活的多 Agent 管理平台。通告单式今日看板、可自定义的 Agent 团队、任务、习惯与复盘。">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Équipe</title>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a dark film-slate rail on the left, a call sheet on the right. One row per agent. */
:root{
  --bg:#f1f2f5; --surface:#ffffff; --sunk:#e8eaf0; --ink:#171a2b; --muted:#646a82; --line:#dcdfe8;
  --accent:#f0b429; --accent-ink:#8a5f00; --on-accent:#1a1400;
  --side:#171a2b; --side-ink:#eceef6; --side-muted:#9aa0b8;
  --ok:#1f8a5b; --bad:#c23b22;
  --display:"Bricolage Grotesque","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  --body:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f111a; --surface:#181b28; --sunk:#11131d; --ink:#eceef6; --muted:#9aa0b8; --line:#2b2f42;
  --accent:#f2b632; --accent-ink:#f2b632; --on-accent:#1a1400;
  --side:#0a0c13; --side-ink:#eceef6; --side-muted:#8d93ab; --ok:#4cc38a; --bad:#f0806a; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f111a; --surface:#181b28; --sunk:#11131d; --ink:#eceef6; --muted:#9aa0b8; --line:#2b2f42;
  --accent:#f2b632; --accent-ink:#f2b632; --on-accent:#1a1400;
  --side:#0a0c13; --side-ink:#eceef6; --side-muted:#8d93ab; --ok:#4cc38a; --bad:#f0806a; color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-ink);padding:22px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;align-self:start;height:100vh}
.brand{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:-.02em;line-height:1}
.brand small{display:block;font-family:var(--body);font-weight:400;font-size:12px;color:var(--side-muted);margin-top:8px;letter-spacing:0}
.stripe{height:6px;border-radius:1px;background:repeating-linear-gradient(115deg,var(--accent) 0 12px,transparent 12px 24px)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{background:none;border:0;text-align:left;color:var(--side-muted);white-space:nowrap}
.nav button:hover{color:var(--side-ink)}
.nav button[aria-current="page"]{background:var(--accent);color:var(--on-accent);font-weight:600}
.side .status{margin-top:auto;font-size:12px;color:var(--side-muted);line-height:1.5}

main{padding-block:28px 96px;padding-inline:clamp(16px,4vw,44px);min-width:0;max-width:1080px;width:100%}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
.kicker{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-ink)}
h1{font-family:var(--display);font-size:30px;font-weight:700;letter-spacing:-.02em;margin:2px 0 0;line-height:1.15;text-wrap:balance}
h2{font-size:15px;margin:0;font-weight:600}
.sub{color:var(--muted);margin:4px 0 0;max-width:60ch}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stack{display:flex;flex-direction:column;gap:16px}
.grow{flex:1 1 180px;min-width:0}

.btn{border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:6px;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.btn.ai{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.ghost{background:none;border-color:transparent;color:var(--muted);padding:5px 8px}
.btn.ghost:hover:not(:disabled){color:var(--ink);border-color:var(--line)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input[type=date],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:80px;line-height:1.6}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted)}
label.f>*{font-size:14px;color:var(--ink)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px 18px}
.panel>h2{margin-bottom:10px}
.banner{background:var(--sunk);border-left:3px solid var(--accent);padding:10px 14px;border-radius:0 6px 6px 0;color:var(--muted)}
.stats{display:flex;flex-wrap:wrap;gap:28px}
.stat b{display:block;font-family:var(--display);font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}

/* call sheet */
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.sheet-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 18px;border-bottom:2px solid var(--ink);font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.call{display:grid;grid-template-columns:190px minmax(0,1fr);gap:16px;padding:14px 18px;border-bottom:1px solid var(--line)}
.call:last-child{border-bottom:0}
.who{display:flex;gap:10px;align-items:flex-start;min-width:0}
.dot{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:700;font-size:13px}
.who b{display:block;line-height:1.3}
.who small{color:var(--muted);font-size:12px;line-height:1.4;display:block}
.items{display:flex;flex-direction:column;gap:6px;min-width:0}
.item{display:flex;gap:9px;align-items:flex-start;min-width:0}
.item input[type=checkbox]{margin-top:4px;width:15px;height:15px;accent-color:var(--ok);flex:none}
.item .t{flex:1;min-width:0;overflow-wrap:anywhere}
.item.done .t{color:var(--muted);text-decoration:line-through}
.meta{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.meta.late{color:var(--bad);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;display:inline-block}
.chip.on{background:var(--ok);border-color:var(--ok);color:#fff}
.chip.eg{border-style:dashed;color:var(--muted)}
button.chip:hover{border-color:var(--ink)}
.idle{color:var(--muted);font-size:13px}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card.off{opacity:.55}
.card p{margin:0;color:var(--muted);font-size:13px}
.card .foot{margin-top:auto;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between}

.list{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.list .item{padding:11px 16px;border-bottom:1px solid var(--line);align-items:center;flex-wrap:wrap}
.list .item:last-child{border-bottom:0}
.list .item .t{flex:1 1 220px}
.tabs{display:flex;gap:2px;background:var(--sunk);padding:3px;border-radius:7px}
.tabs button{border:0;background:none;padding:5px 12px;border-radius:5px;color:var(--muted)}
.tabs button[aria-pressed=true]{background:var(--surface);color:var(--ink);font-weight:600}
.week{display:flex;gap:4px}
.week button{width:30px;height:34px;border:1px solid var(--line);background:var(--surface);border-radius:5px;font-family:var(--mono);font-size:10px;color:var(--muted);padding:0;line-height:1.2}
.week button.on{background:var(--ok);border-color:var(--ok);color:#fff}
.week button.today{border-color:var(--ink)}

.chat{display:flex;flex-direction:column;gap:12px}
.log{display:flex;flex-direction:column;gap:10px;max-height:52vh;overflow-y:auto;padding:4px 2px}
.msg{max-width:min(640px,92%);padding:10px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.msg.me{align-self:flex-end;background:var(--ink);color:var(--bg);border-color:var(--ink)}
.msg .by{font-size:11px;color:var(--muted);font-family:var(--mono);margin-bottom:2px}
.rich{white-space:pre-wrap;overflow-wrap:anywhere}
.note{border-bottom:1px solid var(--line);padding:14px 0}
.note:last-child{border-bottom:0}
.note .rich{max-width:68ch}

#busy{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 10px 8px 16px;border-radius:99px;display:flex;gap:12px;align-items:center;z-index:30;max-width:calc(100% - 32px)}
#busy button{border:0;background:var(--accent);color:var(--on-accent);border-radius:99px;padding:4px 12px;font-weight:600}
#toast{position:fixed;right:16px;top:calc(16px + env(safe-area-inset-top,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:6px;z-index:50;max-width:calc(100% - 32px)}
#veil{position:fixed;inset:0;background:rgb(10 12 19 / .55);display:grid;place-items:center;padding:16px;z-index:40;overflow-y:auto}
.modal{background:var(--surface);border-radius:10px;width:min(560px,100%);padding:20px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
.modal h2{font-family:var(--display);font-size:20px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:26px;height:26px;border-radius:50%;border:2px solid transparent;padding:0}
.swatches button[aria-pressed=true]{border-color:var(--ink);outline:2px solid var(--surface);outline-offset:-4px}

/* v2 refinements */
body{font-size:15px}
.nav button{display:flex;align-items:center;gap:11px;min-height:42px;padding:0 12px;border-radius:8px}
.nav button .lb{flex:1}
.nav button .ct{font-family:var(--mono);font-size:11px;opacity:.75}
.nav .m-only{display:none}
.me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:14px 6px 0;border-top:1px solid rgb(255 255 255 / .12)}
.me .dot{background:rgb(255 255 255 / .14);width:32px;height:32px}
.me b{display:block;font-size:13px;line-height:1.3}
.me small{font-size:11px;color:var(--side-muted)}
.panel,.sheet,.card,.list{border-radius:12px}
main{padding-block:34px 96px}
h1{font-size:32px}
.gx{flex:1;min-width:0}
.btn.icon{padding:6px;display:inline-flex}
.prog{display:flex;flex-direction:column;gap:8px;flex:0 1 300px;min-width:220px}
.prog-top{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--muted)}
.prog-top b{font-family:var(--display);font-size:22px;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums}
.segs{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px}
.segs i{height:8px;border-radius:2px;background:var(--line)}
.segs i.on{background:var(--ok)}
.quick{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px}
.quick input[type=text]{flex:999 1 220px;border:0;background:transparent;min-height:42px}
.quick select{flex:1 1 130px;width:auto;min-height:42px;background:var(--bg)}
.quick .btn{min-height:42px;padding-inline:18px}
.cols{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.col-main{flex:999 1 460px;min-width:0}
.col-side{flex:1 1 290px;min-width:0;display:flex;flex-direction:column;gap:16px}
.dark{background:var(--side);color:var(--side-ink);border:1px solid var(--line);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.dark .tag{font-family:var(--mono);font-size:11px;color:var(--side-muted)}
.dark .rich{opacity:.9;line-height:1.7}
.sheet .dot{width:36px;height:36px;font-size:15px}
.call{grid-template-columns:240px minmax(0,1fr);padding:16px 20px}
.who{align-items:center}
.item{min-height:34px;align-items:center}
.item input[type=checkbox]{width:18px;height:18px;margin:0}
.pill{font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:4px;background:var(--bg);color:var(--muted);white-space:nowrap}
.pill.late{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad);font-weight:600}
.chip.hb{min-height:36px;padding:0 14px;border-style:dashed;font-size:13px}
.chip.hb.on{border-style:solid;font-weight:600}
.tl{display:flex;flex-direction:column}
.tl-row{display:flex;gap:14px}
.tl-rail{display:flex;flex-direction:column;align-items:center;flex:none;width:36px}
.tl-rail .dot{width:36px;height:36px;font-size:15px}
.tl-rail::after{content:"";flex:1;width:2px;background:var(--line)}
.tl-row:last-child .tl-rail::after{display:none}
.tl-body{flex:1;min-width:0;min-height:58px;padding-block:6px 18px;display:flex;flex-direction:column;gap:4px}
.tl-body .msg{max-width:none;border-radius:4px 12px 12px 12px}
.tl-body .msg.sum{background:var(--side);color:var(--side-ink);border-color:var(--line)}
.pick{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px 0 5px;border:2px solid var(--line);border-radius:22px;background:var(--surface);color:var(--muted)}
.pick[aria-pressed=true]{border-color:var(--ink);color:var(--ink);font-weight:600}
.pick .dot{width:28px;height:28px}
.pick[aria-pressed=false] .dot{filter:grayscale(1);opacity:.55}
.more a,.more button{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:0 16px;background:none;border:0;border-bottom:1px solid var(--line);text-align:left}
.more button:last-child{border-bottom:0}

@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr}
  .side{position:static;height:auto;flex-direction:row;align-items:center;padding:12px 16px;gap:12px}
  .brand{font-size:20px}.brand small,.stripe,.me{display:none}
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--side);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px))}
  .nav button{flex-direction:column;justify-content:center;gap:3px;min-height:50px;padding:0;font-size:11px}
  .nav button .lb{flex:none}
  .nav button .ct,.nav .d-only{display:none}
  .nav .m-only{display:flex}
  main{padding-block:22px 130px}
  #busy{bottom:calc(80px + env(safe-area-inset-bottom,0px))}
  .prog{flex:1 1 100%}
  .list .item .t{flex:1 1 100%}
  .call{grid-template-columns:minmax(0,1fr);gap:8px}
  .two{grid-template-columns:1fr}
  h1{font-size:25px}
}
@media (prefers-reduced-motion:no-preference){ .btn,.nav button,.chip{transition:border-color .12s,background .12s,color .12s} }
</style>

</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">Équipe<small>我的 Agent 团队</small></div>
    <div class="stripe" aria-hidden="true"></div>
    <nav class="nav" id="nav" aria-label="主导航"></nav>
    <div class="me"><span class="dot" id="me-dot" aria-hidden="true"></span><div><b id="me-name"></b><small id="status"></small></div></div>
  </aside>
  <main id="main"></main>
</div>
<div id="busy" hidden><span id="busy-text"></span><button type="button" id="busy-stop">停止</button></div>
<div id="toast" hidden role="status"></div>
<div id="veil" hidden></div>

<script>
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
function h(tag, props, ...kids) {
  const e = document.createElement(tag); let val;
  for (const k in props || {}) {
    const v = props[k]; if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k === 'value') val = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'for') e.htmlFor = v;
    else if (k in e) e[k] = v;
    else e.setAttribute(k, v);
  }
  for (const c of kids.flat(Infinity)) { if (c == null || c === false) continue; e.append(c.nodeType ? c : document.createTextNode(String(c))); }
  if (val !== undefined) e.value = val;
  return e;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function rich(t, id) { const d = h('div', { class: 'rich', id }); d.innerHTML = esc(t || '').replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>'); return d; }
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => ymd(new Date());
const dayOff = n => { const d = new Date(); d.setDate(d.getDate() + n); return ymd(d); };
const WD = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
const wdOf = s => WD[new Date(s + 'T12:00:00').getDay()];
const HUES = [222, 262, 330, 8, 32, 150, 180, 200];
const hue = a => 'hsl(' + (a && a.hue != null ? a.hue : 222) + ' 58% 46%)';
const ST = { todo: '待办', doing: '进行中', done: '完成' };
const NOTE_T = { brief: '晨会简报', review: '周复盘', roundtable: '圆桌纪要', journal: '随记' };
const IC = { today: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  team: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5M16 4.8a3.5 3.5 0 0 1 0 6.4M18.5 14.9c1.7.8 2.7 2.5 3 5.1"/>',
  tasks: '<rect x="3" y="3" width="18" height="18" rx="3"/><path d="m8 12 3 3 5-6"/>',
  habits: '<path d="M17 2.5 21 6.5l-4 4"/><path d="M3 11.5v-1a4 4 0 0 1 4-4h14M7 21.5l-4-4 4-4"/><path d="M21 12.5v1a4 4 0 0 1-4 4H3"/>',
  chat: '<path d="M21 12a8 8 0 0 1-11.8 7L3 21l1.9-5.3A8 8 0 1 1 21 12Z"/>',
  review: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  settings: '<path d="M4 6h10M18 6h2M4 12h3M11 12h9M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',
  more: '<path d="M5 12h.01M12 12h.01M19 12h.01"/>', plus: '<path d="M12 5v14M5 12h14"/>' };
function icon(n, z) { const w = h('span', { style: 'display:inline-flex', 'aria-hidden': 'true' }); z = z || 18;
  w.innerHTML = '<svg width="' + z + '" height="' + z + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + IC[n] + '</svg>'; return w; }
let toastT;
function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3200); }

/* ---------- state + store ---------- */
const S = { view: 'today', agents: [], tasks: [], habits: [], notes: [], chats: [], profile: {}, db: null, sample: null, dl: null,
  mode: 'loading', busy: null, ctl: null, stream: null, pendingUser: null, rt: null, chatAgent: null, chatMode: 'solo',
  tf: { agent: '', status: 'open' }, nf: '' };
const COLS = ['agents', 'tasks', 'habits', 'notes', 'chats'];
const STANDALONE = !(window.claude && window.claude.use), LS = 'equipe-v1';
function persist() { if (S.db) return; try { localStorage.setItem(LS, JSON.stringify({ profile: S.profile, agents: S.agents, tasks: S.tasks, habits: S.habits, notes: S.notes, chats: S.chats })); } catch (e) {} }

function dbMsg(e) { return e && e.code === 'quota_exceeded' ? '存储已满，请删除一些旧记录' : e && e.code === 'invalid_argument' ? '没有写入权限或数据格式有误' : '保存失败，请稍后再试'; }

async function put(col, id, data) { if (!S.db) return localSet(col, id, data, false); try { await S.db.collection(col).doc(id).set(data); } catch (e) { toast(dbMsg(e)); } }

function connect(db) {
  if (!db) { S.mode = 'local'; restore(); return schedule(); }
  S.db = db; S.mode = 'live';

  for (const c of COLS) db.collection(c).onSnapshot(s => { S[c] = s.docs.map(d => ({ id: d.id, ...d.data() })); schedule(); }, fail);
  db.doc('meta/profile').onSnapshot(s => { S.profile = s.exists ? { ...s.data() } : {}; schedule(); }, fail);

function runRoundtable(q, ids) {

    for (let i = 0; i < who.length; i++) {
      const prev = S.rt.parts.slice(0, i).map(p => p.name + '：' + p.text).join('\n\n');
      const p = persona(who[i]) + '\n\n现在是团队圆桌。议题：' + q + (prev ? '\n\n前面同事的发言：\n' + prev : '') + '\n\n请只从你的职责角度发言，150 字以内：给出判断和一条具体建议；有不同意见就直接说。';

    const r = await S.sample(p, { cache: false, signal, onText: streamTo('rt-sum') });
    S.rt.summary = r.text; const id = 'rt-' + uid(); S.rt.noteId = id;
    await put('notes', id, { type: 'roundtable', date: today(), title: '圆桌：' + q.slice(0, 40), body: all + '\n\n**主理人总结**\n' + r.text, createdAt: Date.now() });
  });
}
function proposeTasks(label, source, fallbackId) {
  run(label, async signal => {
    const names = active().map(a => a.name).join('、');
    const p = '把下面的内容拆成可以直接执行的任务。今天是 ' + today() + '。可分配的 Agent：' + names + '。\n\n内容：\n' + source +
      '\n\n只回复一个 JSON 数组，最多 8 项，每项形如 {"title":"动词开头的具体任务","agent":"上面某个 Agent 的名字","due":"YYYY-MM-DD 或空字符串","priority":"high 或 normal"}。';
    const out = await S.sample.json(p, { cache: false, signal });
    const items = (Array.isArray(out) ? out : []).filter(x => x && x.title).slice(0, 8).map(x => {
      const a = active().find(y => y.name === x.agent);

      h('div', { class: 'row' }, h('div', { class: 'tabs' }, [['', '全部'], ['review', '周复盘'], ['brief', '晨会'], ['roundtable', '圆桌'], ['journal', '随记']].map(([k, l]) => h('button', { type: 'button', 'aria-pressed': String(S.nf === k), onclick: () => { S.nf = k; schedule(); } }, l)))),
      ns.length ? h('div', { class: 'panel' }, ns.slice(0, 60).map(n => h('div', { class: 'note' },
        h('div', { class: 'row', style: 'justify-content:space-between' }, h('div', { class: 'row' }, h('b', null, n.title || NOTE_T[n.type]), h('span', { class: 'chip' }, NOTE_T[n.type] || n.type), h('span', { class: 'meta' }, n.date)), confirmBtn('删除', () => del('notes', n.id))),
        rich(n.body)))) : h('div', { class: 'panel idle' }, '还没有记录。在今日页写随记、开晨会，或在对话页开一次圆桌，都会存到这里。'));
  },
  more() {
    return h('div', { class: 'stack' }, head('More', '更多'),
      h('div', { class: 'list more' }, [['team', '团队', '新建和编辑 Agent'], ['review', '复盘', '周复盘、晨会和圆桌记录'], ['settings', '设置', '关于我、数据导出']].map(([k, l, d]) =>
        h('button', { type: 'button', onclick: () => go(k) }, icon(k, 20), h('span', { class: 'gx' }, h('b', null, l), h('small', { class: 'idle', style: 'display:block' }, d))))));
  },
  settings() {
    const p = S.profile, modeTxt = { live: '已连接，数据自动保存到这个页面的存储里', local: '数据保存在当前浏览器里，清除浏览器数据会丢失，建议定期导出备份', loading: '正在连接…', error: '存储连接中断，请刷新页面' }[S.mode];
    return h('div', { class: 'stack' }, head('Settings', '设置'),
      h('div', { class: 'panel stack', style: 'gap:12px' }, h('h2', null, '关于我'), h('p', { class: 'sub' }, '每位 Agent 开口前都会读到这三项。写得越具体，它们的建议越贴近你。'),
        F('怎么称呼你', h('input', { type: 'text', id: 'pf-name', value: p.name || '', maxLength: 30 })),
        F('背景', h('textarea', { id: 'pf-about', rows: 3, maxLength: 1500, value: p.about || '', placeholder: '在读什么、做过什么、平时的作息' })),
        F('当前目标', h('textarea', { id: 'pf-goals', rows: 3, maxLength: 1500, value: p.goals || '', placeholder: '这一两个月最想做成的事，带上期限' })),
        h('div', { class: 'row' }, h('button', { type: 'button', class: 'btn primary', onclick: () => { saveProfile({ name: $('#pf-name').value.trim(), about: $('#pf-about').value.trim(), goals: $('#pf-goals').value.trim() }); toast('已保存'); } }, '保存'))),
      h('div', { class: 'panel stack', style: 'gap:10px' }, h('h2', null, '数据'),
        h('p', { class: 'sub' }, '存储：' + modeTxt + '。AI：' + (S.sample ? '可用，调用会计入你自己的 Claude 用量' : STANDALONE ? '公开演示版没有接入' : '当前不可用') + '。'),
        h('p', { class: 'sub' }, S.agents.length + ' 位 Agent · ' + S.tasks.length + ' 个任务 · ' + S.habits.length + ' 个习惯 · ' + S.notes.length + ' 条记录'),
        h('div', { class: 'row' }, h('button', { type: 'button', class: 'btn', onclick: async () => {
          const name = 'equipe-backup-' + today() + '.json', data = JSON.stringify({ exportedAt: new Date().toISOString(), profile: S.profile, agents: S.agents, tasks: S.tasks, habits: S.habits, notes: S.notes, chats: S.chats }, null, 2);
          if (!S.dl) { const a = h('a', { href: URL.createObjectURL(new Blob([data], { type: 'application/json' })), download: name }); document.body.append(a); a.click(); a.remove(); return; }
          try { await S.dl.save({ filename: name, data }); toast('已导出'); } catch (e) { if (!e || e.code !== 'declined') toast('导出失败'); } } }, '导出全部数据（JSON）'),
          h('label', { class: 'btn', style: 'cursor:pointer' }, '从备份导入', h('input', { type: 'file', accept: '.json,application/json', hidden: true, onchange: e => {
            const f = e.target.files[0]; if (!f) return; const r = new FileReader();
            r.onload = () => { try { const d = JSON.parse(r.result); let n = 0;
                for (const c of COLS) for (const x of (Array.isArray(d[c]) ? d[c] : [])) { if (!x || !x.id) continue; const { id, ...rest } = x; put(c, String(id), rest); n++; }
                if (d.profile && typeof d.profile === 'object') saveProfile(d.profile); toast('已导入 ' + n + ' 条记录'); } catch (x) { toast('这个文件不是有效的备份'); } };
            r.readAsText(f); e.target.value = ''; } })))));
  },
};
const NAV = [['today', '今日', ''], ['team', '团队', 'd-only'], ['tasks', '任务', ''], ['habits', '习惯', ''], ['chat', '对话', ''], ['review', '复盘', 'd-only'], ['settings', '设置', 'd-only'], ['more', '更多', 'm-only']];
function go(v) { S.view = v; try { history.replaceState(null, '', '#' + v); } catch (e) {} render(); window.scrollTo(0, 0); }

function render() {
  const main = $('#main'), keep = {};
  main.querySelectorAll('input[id],textarea[id],select[id]').forEach(e => { if (e.type !== 'checkbox') keep[e.id] = e.value; });
  const act = document.activeElement, actId = act && main.contains(act) ? act.id : '';
  const sel = actId && act.selectionStart != null ? [act.selectionStart, act.selectionEnd] : null;
  const view = VIEWS[S.view]();
  main.replaceChildren(S.mode === 'local' && STANDALONE && !S.agents.length ? h('div', { class: 'banner', style: 'margin-bottom:16px' }, '这是公开演示版：数据只保存在你的浏览器里，没有接入 AI。') : S.mode === 'error' ? h('div', { class: 'banner', style: 'margin-bottom:16px' }, '存储连接中断，请刷新页面。') : '', view);
  for (const id in keep) { const e = document.getElementById(id); if (e && main.contains(e)) e.value = keep[id]; }
  const ta = $('#tf-agent'); if (ta) ta.onchange = () => { S.tf.agent = ta.value; schedule(); };
  if (actId) { const e = document.getElementById(actId); if (e) { e.focus(); if (sel) try { e.setSelectionRange(sel[0], sel[1]); } catch (x) {} } }
  const log = $('.log'); if (log) log.scrollTop = log.scrollHeight;
  const cnt = { today: S.tasks.filter(x => isToday(x) && x.status !== 'done').length, tasks: S.tasks.filter(x => x.status !== 'done').length, team: S.agents.length };
  $('#nav').replaceChildren(...NAV.map(([k, l, c]) => h('button', { type: 'button', class: c, 'aria-current': S.view === k || (k === 'more' && ['team', 'review', 'settings'].includes(S.view)) ? 'page' : null, onclick: () => go(k) },
    icon(k), h('span', { class: 'lb' }, l), cnt[k] ? h('span', { class: 'ct' }, cnt[k]) : null)));
  $('#me-name').textContent = S.profile.name || '我'; $('#me-dot').textContent = (S.profile.name || '我').slice(0, 1);
  $('#status').textContent = { live: '数据已同步', local: '保存在本浏览器', loading: '连接中…', error: '连接中断' }[S.mode] + (S.sample ? ' · AI 可用' : '');
  $('#busy').hidden = !S.busy; $('#busy-text').textContent = S.busy ? S.busy + '…' : '';
}
$('#busy-stop').onclick = () => S.ctl && S.ctl.abort();
$('#veil').addEventListener('mousedown', e => { if (e.target.id === 'veil') closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#veil').hidden) closeModal(); });

const hv = location.hash.slice(1); if (VIEWS[hv]) S.view = hv;
render();
if (window.claude && window.claude.use) {
  claude.use('db').then(connect, () => connect(null));
  claude.use('sample').then(s => { S.sample = s; schedule(); }, () => {});
  claude.use('downloads').then(d => { S.dl = d; schedule(); }, () => {});
} else connect(null);
</script>
</body>
</html>
