:"self",text:"（第一屏挂着这条，今晚的客怕是要被劝退。得赶紧处理。）",mood:"neutral"}],trigger:{weight:10,conditions:[{kind:"channel",key:"dianpingOn",value:!0}],cooldownDays:6},options:[{label:"逐条回复 + 私信补偿一张体验券",effects:{cash:-200,reputation:4,customerLoyalty:3,setFlags:{reviewHandledWell:!0}},resultText:"你诚恳回复并送了补偿券。对方追评「老板态度不错」，路人缘拉回来一点。",reply:{npcId:"critic_anon",text:"……行吧，老板态度还可以，我加一星。下次别念稿了啊。",mood:"neutral"}},{label:"公开回怼：「散客不懂还原本就别玩硬核」",effects:{reputation:-6,incFlags:{badReviewCount:1},setFlags:{reviewHandledBadly:!0}},resultText:"你怼得很爽。但截图已经被人保存……",reply:{npcId:"critic_anon",text:"哦？店家亲自下场教育消费者了是吧。截图我收好了，等着。",mood:"smug"},chains:[{eventId:"cust_xhs_ferment",probability:.8,delayDays:2}]},{label:"冷处理，不回复",effects:{reputation:-2},resultText:"你选择不理会。差评继续挂着，慢慢沉下去——但也可能有人盯上。",chains:[{eventId:"cust_xhs_ferment",probability:.25,delayDays:3}]}]},{id:"cust_xhs_ferment",anchorNpc:"critic_anon",dialogue:[{npcId:"staff_front",text:"老板，那条差评被人搬到小红书了…现在标题是《花298被老板教育做人》，正在涨赞。",mood:"shock"},{npcId:"critic_anon",text:"截图我可留着呢。评论区已经有人对号入座了哦，老板还硬气吗？",mood:"smug"},{npcId:"self",text:"（一条差评发酵成万赞笔记…这波接不好，真要伤筋动骨。）",mood:"sad"}],category:"gossip",title:"上小红书了：#北京这家剧本杀别去",speaker:"小红书·万赞笔记",description:"那位玩家把你回怼的截图发了小红书，标题《花298被老板教育做人》。评论区开始有人对号入座:「我上次也觉得演员敷衍」。笔记还在涨。",trigger:{weight:0,chainedOnly:!0},options:[{label:"正式道歉长文 + 全单退款 + 邀请回访",effects:{cash:-1500,reputation:6,customerLoyalty:4,setFlags:{reviewHandledBadly:!1}},resultText:"低头认错 + 真金白银退款，舆论转向「至少敢担责」。出血止住了。"},{label:"硬刚到底，发小作文逐条反驳",effects:{reputation:-12,customerSize:-8,incFlags:{prCrisis:1}},resultText:"你越解释对线越多，笔记冲上同城热门。口碑暴跌，老客开始观望。",chains:[{eventId:"cust_regulars_leaving",probability:.7,delayDays:4}]},{label:"冷处理，等它自己沉",effects:{reputation:-5,customerSize:-3},resultText:"你忍住没回。一周后热度确实退了，但「服务差」的印象留在了搜索结果里。",chains:[{eventId:"cust_regulars_leaving",probability:.3,delayDays:5}]},{label:"借势营销：自黑做个「老板挨骂」短视频",requires:[{kind:"channel",key:"dianpingOn",value:!0}],effects:{cash:-800,reputation:8,customerSize:6,contentHeatTop:5},resultText:"你把危机做成段子，自黑认错还顺手宣传新本。一波路人转粉，反而涨了。高风险高回报。"}]},{id:"cust_regulars_leaving",anchorNpc:"reg_ak",dialogue:[{npcId:"staff_front",text:"老板…私域群里气氛不对，刚又默默退了俩老客。",mood:"sad"},{npcId:"reg_ak",text:"最近口碑不太行啊，我先观望观望，不太敢约了。",mood:"neutral"},{npcId:"self",text:"（私域是命根子，老客这一松动，复购就要塌。得赶紧稳住。）",mood:"shock"}],category:"customer",title:"老客群里在「跑路」",speaker:"私域社群",description:"几个常来的老玩家在群里发「最近口碑不太行，先观望」，有人默默退了群。私域是你的命根子，这波要是稳不住，复购就塌了。",trigger:{weight:0,chainedOnly:!0},options:[{label:"老客专场 + 五折回馈 + 老板亲自陪玩",effects:{cash:-2e3,customerLoyalty:8,customerSize:5,reputation:3},resultText:"你拉下脸亲自陪了两场，老客被诚意打动，群里气氛回暖。钱花得值。"},{label:"发个红包雨敷衍一下",effects:{cash:-600,customerLoyalty:2,customerSize:-4},resultText:"红包是抢了，但没人觉得问题解决了。又走了一小批。"},{label:"不挽留，专注拉新",effects:{customerSize:-12,reputation:-2},resultText:"你赌新客能补上。老客寒了心，私域规模明显缩水——这是慢性失血。"}]},{id:"cust_pinchang_dispute",anchorNpc:"staff_front",dialogue:[{npcId:"staff_front",text:"老板快来！拼场那桌闹起来了，三人队和一对情侣，都要退款。",mood:"shock"},{npcId:"reg_laopao",text:"我们是来玩本的，不是来看你俩秀恩爱出戏的！这场不值。",mood:"angry"},{npcId:"player_emo",text:"我们怎么了…正常玩游戏啊，凭什么说我们？",mood:"sad"}],category:"customer",title:"拼场两桌吵起来了",speaker:"前台",description:"周末满场，一个三人小队和一对情侣拼了同一场恐怖本。情侣全程搂搂抱抱出戏，三人队当场黑脸:「我们是来玩本的不是来看你俩的。」现在两边都要求退款。",trigger:{weight:7,minDay:3,cooldownDays:5},options:[{label:"给三人队免单，情侣照常收费",effects:{cash:-450,reputation:2,customerLoyalty:2},resultText:"你判了「谁出戏谁担责」。三人队满意，情侣悻悻离开，大体服众。"},{label:"各退一半，和稀泥",effects:{cash:-600,reputation:-1},resultText:"两边都不太满意，但没闹大。下次得想想拼场规则了。"},{label:"坚持不退，按规则办",effects:{reputation:-4,incFlags:{badReviewCount:1}},resultText:"你搬出「拼场须知」。三人队当场就要去写差评……",chains:[{eventId:"cust_bad_review",probability:.5,delayDays:1}]}]},{id:"cust_roast_actor",anchorNpc:"reg_laopao",dialogue:[{npcId:"reg_laopao",text:"点评说一句：那个演恶人的，油得不行，全程抢戏，建议回炉。",mood:"smug"},{npcId:"a_xiaolu",text:"老板…我那是入戏好吧，怎么就成抢戏了。你怎么看？",mood:"sad"},{npcId:"self",text:"（护短伤路人缘，压演员又寒了台柱的心。两头不讨好。）",mood:"neutral"}],category:"customer",title:"玩家公开点名吐槽演员",speaker:"玩家",description:"一桌玩家在点评里点名:「那个演恶人的演员油得不行，一直抢戏。」被点的正是你的台柱。台柱看到后心气有点不顺，在问你「老板你怎么看」。",trigger:{weight:6,conditions:[{kind:"hasActorTag",tag:"台柱"}],cooldownDays:8},options:[{label:"护短：公开力挺演员",effects:{reputation:-2,actor:{target:{select:"byTag",tag:"台柱"},relationship:8,morale:6}},resultText:"你公开站演员。台柱很感动、更卖力，但少数玩家觉得你「护短不听劝」。"},{label:"私下沟通，让演员收着点",effects:{reputation:2,actor:{target:{select:"byTag",tag:"台柱"},relationship:-3,morale:-4}},resultText:"你私下提了意见。演出确实收敛了，但台柱有点憋屈。"},{label:"甩锅给玩家「不懂表演」",effects:{reputation:-5,actor:{target:{select:"byTag",tag:"台柱"},relationship:4}},resultText:"演员爽了，但你又树了个会写小作文的敌人。",chains:[{eventId:"cust_bad_review",probability:.4,delayDays:2}]}]}],hm=[{id:"actor_office_romance",anchorNpc:"a_xiaolu",dialogue:[{npcId:"staff_front",text:"老板，悄悄说…小鹿和陌陌最近黏得不行，下了戏还在排练厅腻歪。",mood:"shy"},{npcId:"a_xiaolu",text:"哎呀被看出来了…老板你别声张嘛。",mood:"shy"},{npcId:"a_momo",text:"处得好是神仙CP，处不好…你懂的。看你怎么排了。",mood:"smug"}],category:"actor",title:"店里两个演员好上了",speaker:"后台",description:"你发现两个恋爱脑演员最近眉来眼去，下了戏还在排练厅黏着。同事们有的磕到了、有的翻白眼。处得好是「神仙CP默契拉满」，处不好就是「分手现场全店遭殃」。",trigger:{weight:6,conditions:[{kind:"hasActorTag",tag:"恋爱脑"}],minDay:5,cooldownDays:12},options:[{label:"祝福并排成固定CP档，主推情感本",effects:{actor:{target:{select:"byTag",tag:"恋爱脑"},relationship:6,morale:8},contentHeatTop:4,reputation:2},resultText:"你顺水推舟把他俩排成CP档，默契肉眼可见，情感本口碑起飞。当然，也押了注。",chains:[{eventId:"actor_couple_breakup",probability:.35,delayDays:9}]},{label:"约法三章：不准影响排班和演出",effects:{actor:{target:{select:"byTag",tag:"恋爱脑"},relationship:-3,morale:-2}},resultText:"你提前打了预防针。情绪风险降低，但俩人觉得老板有点扫兴。"},{label:"拆档：把俩人排到不同班次",effects:{actor:{target:{select:"byTag",tag:"恋爱脑"},relationship:-8,morale:-6}},resultText:"你强行拆开。恋爱脑很受伤，干活没了心气，稳定性堪忧。",chains:[{eventId:"actor_quit_threat",probability:.3,delayDays:6}]}]},{id:"actor_couple_breakup",anchorNpc:"a_momo",dialogue:[{npcId:"a_momo",text:"我不干了！谁爱演谁演！（摔剧本）",mood:"cry"},{npcId:"a_xiaolu",text:"走就走！（黑脸甩门）",mood:"angry"},{npcId:"staff_front",text:"老板…今晚还有满场的情感本，这俩是主演啊，怎么办？",mood:"shock"}],category:"actor",title:"CP当众分手了",speaker:"后台",description:"说好的神仙CP，今天在排练厅摔了剧本。一个哭着说不干了，另一个黑脸甩门。今晚还有满场的情感本等着这俩主演……",trigger:{weight:0,chainedOnly:!0},options:[{label:"连夜调度，自己顶 + 请外援救场",effects:{cash:-1200,reputation:1,actor:{target:{select:"lowestStability"},morale:-2}},resultText:"你花钱请了外援、自己也上阵，场子保住了。钱包和嗓子都很受伤。"},{label:"当和事佬，劝他俩以工作为重",effects:{actor:{target:{select:"byTag",tag:"恋爱脑"},morale:-4,stability:-6}},resultText:"勉强劝住上了台，但俩人全程貌合神离，玩家明显感觉到尬。",chains:[{eventId:"cust_bad_review",probability:.45,delayDays:1}]},{label:"取消今晚的场，全额退款致歉",effects:{cash:-2400,reputation:-3,customerLoyalty:-2},resultText:"你壮士断腕取消演出。退款 + 口碑双输，但避免了一场车祸现场。"}]},{id:"actor_quit_threat",anchorNpc:"a_xiaolu",dialogue:[{npcId:"a_xiaolu",text:"老板，我有点累了，想休息一阵…",mood:"sad"},{npcId:"staff_front",text:"（小声）翻译一下：要么加钱，要么走人。这周排班全指着 TA 呢。",mood:"neutral"},{npcId:"self",text:"（招牌演员一走，冲 TA 来的粉丝也带走一半。得权衡。）",mood:"neutral"}],category:"actor",title:"演员撂挑子要辞职",speaker:"台柱演员",description:"一个核心演员甩来微信:「老板我有点累了，想休息一阵。」——翻译过来就是:要么涨钱要么走人。偏偏这周排班全指着TA。",trigger:{weight:5,conditions:[{kind:"flag",key:"someActorAngry",op:"==",value:!0}],cooldownDays:10},options:[{label:"加薪挽留",effects:{cash:-1500,actor:{target:{select:"lowestRelationship"},relationship:10,morale:10}},resultText:"钱到位，心气顺了。但你的薪资盘子又重了一截。"},{label:"动之以情 + 画饼（分红/挑大梁）",effects:{actor:{target:{select:"lowestRelationship"},relationship:5,morale:4}},resultText:"你掏心窝聊了两小时，暂时稳住。饼能撑多久看后续。"},{label:"放人，趁机招新",effects:{reputation:-2,customerLoyalty:-3},resultText:"你放了TA走。短期排班吃紧、熟客有点失落，但甩掉了一个不稳定因素。",chains:[{eventId:"channel_competitor_poach",probability:.4,delayDays:3}]}]},{id:"actor_late",anchorNpc:"staff_front",dialogue:[{npcId:"staff_front",text:"老板，满场的本，主演还没到！玩家都在看表了。",mood:"shock"},{npcId:"a_qiqi",text:"（电话里）堵在三环了…再有半小时！真的对不起对不起。",mood:"cry"},{npcId:"self",text:"（换人顶替还是硬等？玩家的耐心正在一秒秒耗光。）",mood:"angry"}],category:"actor",title:"开场前20分钟，主演还没到",speaker:"前台",description:"满座的场子，DM在催，玩家在等，主演的电话一直占线。终于接通:「堵在三环了，再有半小时……」玩家已经开始看表了。",trigger:{weight:6,conditions:[{kind:"flag",key:"hasUnstableActor",op:"==",value:!0}],cooldownDays:5},options:[{label:"换人顶替 + 给玩家送饮料安抚",effects:{cash:-150,reputation:-1,actor:{target:{select:"lowestStability"},morale:-2}},resultText:"你临时换了多面手顶上，送了饮料。玩家体谅，平稳度过。"},{label:"硬等，全场陪聊撑时间",effects:{reputation:-3,customerLoyalty:-2},resultText:"你尬聊了半小时等人。玩家体验打折，但好歹原班人马上了。",chains:[{eventId:"cust_bad_review",probability:.35,delayDays:1}]},{label:"回头重罚迟到演员",effects:{actor:{target:{select:"lowestStability"},relationship:-6,morale:-5,stability:4}},resultText:"你罚了款立了规矩。以后是准时了，但演员心里记了一笔。"}]}],gm=[{id:"channel_scalper",category:"channel",title:"黄牛脚本抢光了周末场",speaker:"黄牛·三哥",anchorNpc:"scalper_san",description:"你家热门本周末两天的场，开放预约3秒被抢空。一查全是黄牛号，转手加价倒卖。表面满座一片繁荣，可真玩家根本约不到，私域群里已经在骂「这店是不是饥饿营销」。",dialogue:[{npcId:"staff_front",text:"老板，周末两天的场又是 3 秒清空，全是那几个眼熟的号……三哥的脚本。",mood:"sad"},{npcId:"scalper_san",text:"哎老板，咱俩谁跟谁。你家场场满，我赚个辛苦钱，双赢嘛～要不要合作?",mood:"smug"},{npcId:"reg_ak",text:"（私域群里）这店是搞饥饿营销吧?真玩家根本约不到，呵呵。",mood:"angry"}],trigger:{weight:7,conditions:[{kind:"channel",key:"dianpingOn",value:!0},{kind:"resource",key:"reputation",op:">=",value:55}],minDay:8,cooldownDays:10},options:[{label:"上实名预约 + 人工审核，封黄牛号",effects:{cash:-500,reputation:4,customerLoyalty:5,customerSize:4},resultText:"你加了实名核验，黄牛号被一锅端。真玩家约上了，私域口碑回正。麻烦但正确。"},{label:"睁只眼闭只眼，反正场场满",effects:{cash:800,reputation:-8,customerLoyalty:-6,setFlags:{scalperIgnored:!0}},resultText:"短期营收好看，但「黄牛店」的标签贴上了。真爱粉正在流失……",chains:[{eventId:"cust_xhs_ferment",probability:.4,delayDays:4}]},{label:"干脆自己跟黄牛合作分成",effects:{cash:1500,reputation:-12,customerSize:-8,incFlags:{prCrisis:1}},resultText:"黑钱真香，但纸包不住火。一旦被扒，这就是社死级别的瓜。",chains:[{eventId:"channel_scalper_exposed",probability:.6,delayDays:6}]}]},{id:"channel_scalper_exposed",anchorNpc:"critic_anon",dialogue:[{npcId:"reg_laopao",text:"我扒到了——这店家自己跟黄牛分成的聊天记录，发帖了。",mood:"angry"},{npcId:"rival_qian",text:"（路过）哎哟，自己养黄牛？这瓜可不小啊。",mood:"smug"},{npcId:"self",text:"（聊天记录怎么漏的…现在同城圈都在看，同行也来踩。）",mood:"shock"}],category:"gossip",title:"「店家勾结黄牛」被扒了",speaker:"小红书·维权帖",description:"有玩家扒出你和黄牛的分成聊天记录（不知道哪个环节漏的），发帖《剧本杀店家自己养黄牛》。同城圈炸了，同行也来踩一脚。",trigger:{weight:0,chainedOnly:!0},options:[{label:"认账整改 + 老客补偿",effects:{cash:-3e3,reputation:-6,customerLoyalty:3},resultText:"你认了、赔了、立整改。元气大伤但保住了底线，没有彻底社死。"},{label:"矢口否认，说是同行陷害",effects:{reputation:-15,customerSize:-15},resultText:"没人信。口碑塌方，老客大批退群。这一跤摔得很重。"}]},{id:"channel_review_bomb",anchorNpc:"ops_dianping",dialogue:[{npcId:"staff_front",text:"老板！一夜涌进十几条一星，措辞跟复制粘贴似的，评分从4.8掉到4.3了。",mood:"shock"},{npcId:"ops_dianping",text:"我们核查过了，证据不足，不予删除哦。要不…上个推广套餐对冲一下？",mood:"smug"},{npcId:"self",text:"（八成是友商雇的水军。申诉、刷真实好评、还是公开撕？）",mood:"angry"}],category:"channel",title:"一夜之间多了十几条一星",speaker:"运营后台",description:"昨晚到今早，店铺页突然涌入十几条内容雷同的一星差评，措辞像复制粘贴。评分从4.8掉到4.3。八成是友商雇的水军，但平台说「证据不足不予删除」。",trigger:{weight:5,conditions:[{kind:"channel",key:"dianpingOn",value:!0}],minDay:10,cooldownDays:12},options:[{label:"向平台申诉 + 发动真老客刷真实好评",effects:{cash:-300,reputation:3,customerLoyalty:4},resultText:"你两手抓:申诉留证据，同时请老客写真实体验。评分慢慢爬回来。"},{label:"花钱找「公关」对冲刷好评",effects:{cash:-2e3,reputation:1,setFlags:{boughtFakeReviews:!0}},resultText:"评分是拉回来了，但你也下了水。要是哪天平台查刷分……",chains:[{eventId:"channel_review_bomb_backfire",probability:.3,delayDays:7}]},{label:"截图挂出来，公开声讨友商",effects:{reputation:-2,customerLoyalty:2,incFlags:{feudWithRival:1}},resultText:"你把矛头公开指向友商。粉丝声援你，但也彻底撕破脸，结了梁子。",chains:[{eventId:"industry_rival_plagiarism",probability:.35,delayDays:8}]}]},{id:"channel_review_bomb_backfire",anchorNpc:"ops_dianping",dialogue:[{npcId:"ops_dianping",text:"通知一下：平台搞刷分专项清查，你买的那批好评判违规了，店铺降权处理。",mood:"neutral"},{npcId:"self",text:"（搜索排名暴跌…当初不该走这步。认罚老实做吧。）",mood:"sad"}],category:"channel",title:"平台清查刷分，殃及池鱼",speaker:"平台通知",description:"平台搞了波刷分专项清查，你买的那批好评被判违规，店铺被降权处理，搜索排名暴跌。",trigger:{weight:0,chainedOnly:!0},options:[{label:"认罚 + 申请恢复，老老实实做",effects:{cash:-1e3,reputation:-4},resultText:"降权要熬一阵子才能恢复。学费交了，以后不碰刷分。"}]},{id:"channel_ranking_push",anchorNpc:"ops_dianping",dialogue:[{npcId:"ops_dianping",text:"老板！同城剧本杀热门榜活动来了，冲进前十吃一大波公域曝光，机会难得～",mood:"happy"},{npcId:"ops_dianping",text:"当然得配合买推广位 + 做点限时让利。接得住接不住，看你家底了。",mood:"smug"},{npcId:"self",text:"（梭哈冲榜很爽，但回不回得来得算明白账。）",mood:"neutral"}],category:"channel",title:"冲一波同城热门榜?",speaker:"运营",description:"平台搞「同城剧本杀热门榜」活动，冲进前十能吃一大波公域曝光。但要砸钱买推广位 + 做活动让利，回不回得来全看你家接得住接不住。",trigger:{weight:5,conditions:[{kind:"channel",key:"dianpingOn",value:!0}],minDay:12,cooldownDays:14},options:[{label:"梭哈冲榜：买推广位 + 限时五折",effects:{cash:-4e3,reputation:5,customerSize:12,contentHeatAll:6},resultText:"一波猛冲挤进榜单，新客哗哗来。短期肉疼，但流量是真的。"},{label:"小成本试水，只买基础推广",effects:{cash:-1200,reputation:1,customerSize:4},resultText:"稳健投放，涨了一点曝光。没冲上榜，但也没伤筋动骨。"},{label:"不参与，靠口碑自然增长",effects:{reputation:1},resultText:"你不跟风烧钱。这一波热度没蹭到，省下的钱留给上新本。"}]},{id:"channel_competitor_poach",anchorNpc:"rival_qian",dialogue:[{npcId:"a_xiaolu",text:"老板…隔壁谜雾馆开了高我30%的薪水，还给分红。我念旧情先来问问你。",mood:"shy"},{npcId:"rival_qian",text:"（私下）小鹿这样的台柱，跟着我才有前途。老板，你接得住吗？",mood:"smug"},{npcId:"self",text:"（台柱是招牌，加薪留人现金压力陡增；放走又带走一批粉。）",mood:"sad"}],category:"channel",title:"友商来挖你的台柱",speaker:"台柱演员",description:"台柱犹豫着告诉你:隔壁新开的「谜雾馆」开了高你30%的薪水来挖TA，还承诺给分红。TA念旧情先来问你，但语气里全是「你接不接得住」。",trigger:{weight:6,conditions:[{kind:"hasActorTag",tag:"台柱"}],minDay:9,cooldownDays:10},options:[{label:"咬牙加薪 + 给分红留人",effects:{cash:-1e3,actor:{target:{select:"byTag",tag:"台柱"},relationship:12,morale:10}},resultText:"你拿出诚意把人留住了。现金压力陡增，但台柱是你的招牌，值。"},{label:"打感情牌，谈理想谈情怀",effects:{actor:{target:{select:"byTag",tag:"台柱"},relationship:4}},resultText:"你聊了情怀。TA感动了一下，但「房贷不会因为情怀变少」——悬着。",chains:[{eventId:"actor_quit_threat",probability:.4,delayDays:5}]},{label:"放手祝福，绝不加价",effects:{reputation:-3,customerLoyalty:-5,customerSize:-6},resultText:"台柱走了，带走了一批冲着TA来的粉丝。你得赶紧捧个新人。"}]}],ym=[{id:"industry_rival_plagiarism",anchorNpc:"rival_qian",dialogue:[{npcId:"reg_laopao",text:"老板，隔壁谜雾馆新本，核心诡计跟你那原创本几乎一模一样，连台词都改改就用！",mood:"angry"},{npcId:"writer_lin",text:"我熬夜攒的心血，被人换个皮就端走了…老板你得管！",mood:"cry"},{npcId:"rival_qian",text:"什么抄不抄的，创意撞车很正常嘛。有本事你去告啊。",mood:"smug"}],category:"industry",title:"友商把你的原创本抄了",speaker:"老玩家爆料",description:"有老玩家发现:隔壁「谜雾馆」新上的本，核心诡计、人物关系跟你的原创本几乎一模一样，连台词都改了改就用。你熬夜攒的心血，被人换个皮就端走了。",trigger:{weight:5,conditions:[{kind:"flag",key:"hasOriginalScript",op:"==",value:!0}],minDay:12,cooldownDays:16},options:[{label:"走法律 + 公开维权，晒创作时间线",effects:{cash:-2e3,reputation:6,contentHeatTop:6,customerLoyalty:5},resultText:"你晒出完整创作记录硬刚维权。玩家纷纷站你，原创本反而又火了一把。钱花得有价值。"},{label:"私下交涉，要求下架或赔偿",effects:{cash:1e3,reputation:-1},resultText:"对方赔了点钱了事。你拿了和解金，但「被抄」这事没能转化成口碑。"},{label:"算了，赶紧出下一个原创本拉开身位",effects:{cash:-3e3,contentHeatTop:8,reputation:3,setFlags:{rushingNewScript:!0}},resultText:"你不纠缠，直接用新本甩开对手。气魄够，但连续出本的现金压力是真大。"}]},{id:"industry_piracy_leak",anchorNpc:"publisher_zhou",dialogue:[{npcId:"publisher_zhou",text:"老板，你那原创本的完整电子版，在好几个资源共享群里传开了，含真相和人物本。",mood:"neutral"},{npcId:"lawyer_he",text:"想维权可以，但盗版源头难锁定，发函下架是治标。先把店内体验做出护城河。",mood:"neutral"},{npcId:"self",text:"（外地小店随便就能开，我的独家性正在蒸发。）",mood:"sad"}],category:"industry",title:"你的原创本电子版在群里流传",speaker:"同行群截图",description:"有人把你原创本的完整电子文档（含真相和人物本）打包，在好几个「资源共享群」里传。外地小店拿去随便开，你的独家性正在蒸发。",trigger:{weight:4,conditions:[{kind:"flag",key:"hasOriginalScript",op:"==",value:!0}],minDay:14,cooldownDays:20},options:[{label:"全网发函下架 + 升级店内独家机关版",effects:{cash:-2500,reputation:4,contentHeatTop:5},resultText:"你一边打击盗版，一边把店内体验做成「电子版给不了的实景机关版」。护城河重新挖深。"},{label:"把盗版当宣发，主打「正版沉浸体验」",effects:{reputation:2,customerSize:5,contentHeatTop:3},resultText:"你反向操作:盗版越传越多人知道这个本，引流来店体验正版。四两拨千斤。"},{label:"不管了，反正拦不住",effects:{contentHeatTop:-8,reputation:-2},resultText:"盗版泛滥，本子迅速烂大街，热度加速过气。独家性没了。"}]},{id:"industry_genre_outdated",anchorNpc:"reg_laopao",dialogue:[{npcId:"staff_front",text:"老板，后台数据不太好看，招牌本预约量连着下滑。",mood:"sad"},{npcId:"reg_laopao",text:"说句实话，你这本…老套路了，玩腻了。市场风向早变了。",mood:"neutral"},{npcId:"self",text:"（再不上新本，这桌菜单就要凉透。但上新本是笔大钱。）",mood:"shock"}],category:"industry",title:"你的招牌本明显过气了",speaker:"运营数据",description:"后台数据很诚实:招牌本预约量连续下滑，玩家评价从「好玩」变成「老套路了」。市场风向转了，再不上新本，这桌菜单就要凉透。",trigger:{weight:6,conditions:[{kind:"resource",key:"contentHeat",op:"<",value:40}],minDay:14,cooldownDays:8},options:[{la
