    document.documentElement.lang = lang;
    document.documentElement.dir = (lang === 'ar' ? 'rtl' : 'ltr');

        scoreLabel = document.getElementById('scoreLabel'), metricsEl = document.getElementById('metrics');

  function analyze(text, t) {
    // CJK (Chinese/Japanese/Korean) has no spaces — count characters; otherwise count words.
    const cjk = (text.match(/[一-鿿぀-ヿ가-힯]/g) || []).length;
    const nonCjk = (text.replace(/[一-鿿぀-ヿ가-힯]/g, ' ').match(/\S+/g) || []).length;
    const words = cjk + nonCjk;
    const links = (text.match(/https?:\/\//gi) || []).length;
    const exclaim = (text.match(/!|！/g) || []).length;
    const capsWords = (text.match(/\b[A-Z]{3,}\b/g) || []).length;
    const hasQuestion = /\?|？/.test(text);
    const lower = text.toLowerCase();
    const foundSpam = t.spam.list.filter(w => lower.includes(w.toLowerCase()));
    const generic = t.greet.test(text);

    const issues = [];
    const add = (msg, penalty) => issues.push({ msg, penalty });
    if (words > 150) add(t.too_long.replace("{x}", words), 18);
    else if (words > 0 && words < 20) add(t.too_short.replace("{x}", words), 15);
    if (foundSpam.length) add(t.spam.msg.replace("{x}", foundSpam.slice(0, 6).join(", ")), Math.min(10 + foundSpam.length * 3, 25));
    if (links > 2) add(t.links.replace("{x}", links), 12);
    if (!hasQuestion) add(t.no_cta, 18);
    if (exclaim > 1 || capsWords > 1) add(t.shouting, 10);
    if (generic) add(t.generic, 10);

    const score = Math.max(0, 100 - issues.reduce((s, i) => s + i.penalty, 0));
    return { words, links, score, issues };
  }

  go.addEventListener('click', () => {
    const t = I18N[lang];
    const text = document.getElementById('email').value;
    if (!text.trim()) { alert(t.empty); return; }
    const r = analyze(text, t);

    const color = r.score >= 80 ? ['bg-green-100','text-green-700', t.sc_good]
                : r.score >= 50 ? ['bg-amber-100','text-amber-700', t.sc_ok]
                : ['bg-red-100','text-red-700', t.sc_bad];
    scoreCircle.className = "shrink-0 w-20 h-20 rounded-full flex items-center justify-center text-2xl font-bold " + color[0] + " " + color[1];
    scoreCircle.textContent = r.score;
    scoreLabel.textContent = color[2];
    metricsEl.textContent = `${r.words} ${t.m_words} · ${r.links} ${t.m_links}`;

    if (r.issues.length === 0) {
      issuesEl.innerHTML = `<li class="flex gap-2 text-[14px] text-green-700"><span>✓</span><span>${t.all_good}</span></li>`;
    } else {
      issuesEl.innerHTML = r.issues.map(i =>
        `<li class="flex gap-2 text-[14px] text-slate-700"><span class="text-amber-500 shrink-0">•</span><span></span></li>`).join('');
      [...issuesEl.querySelectorAll('li span:last-child')].forEach((s, idx) => s.textContent = r.issues[idx].msg);
    }
    result.classList.remove('hidden');
  });

  // ───────────── waitlist (configure FORMSPREE_ENDPOINT) ─────────────
  const FORMSPREE_ENDPOINT = "https://formspree.io/f/FORMSPREE_ENDPOINT";
  const form = document.getElementById('waitlist-form'), wlMsg = document.getElementById('wl_msg');
  form.addEventListener('submit', async ev => {
    ev.preventDefault(); const t = I18N[lang]; const data = new FormData(form); data.append('lang', lang);
    wlMsg.className = "mt-4 text-sm font-medium text-slate-300"; wlMsg.textContent = "…"; wlMsg.classList.remove('hidden');
    try {
      if (FORMSPREE_ENDPOINT.includes('FORMSPREE_ENDPOINT')) throw 0;
      const r = await fetch(FORMSPREE_ENDPOINT, { method: 'POST', body: data, headers: { Accept: 'application/json' } });
      if (!r.ok) throw 0;
      wlMsg.className = "mt-4 text-sm font-medium text-green-400"; wlMsg.textContent = "✓"; form.reset();
    } catch { wlMsg.className = "mt-4 text-sm font-medium text-amber-400"; wlMsg.textContent = "(demo: configure Formspree)"; }
  });
</script>
</body>
</html>
